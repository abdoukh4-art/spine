name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      { label: What happened?, description: Include the request ID (x-request-id) if you have one. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, render: shell }
  - type: input
    id: version
    attributes: { label: Version / commit }
