# Security scanning (ADR-0022, docs/security). Runs on PRs, pushes and weekly.
name: security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fail on high/critical advisories
        run: pnpm audit --audit-level high

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: spine-sbom.cdx.json
          artifact-name: spine-sbom.cdx.json

  # Build both production images and scan them (ADR-0085). Runs Trivy on the OS packages
  # and the bundled node_modules; HIGH/CRITICAL with an available fix fail the job.
  # Third-party actions are pinned to a full commit SHA: tags are mutable, and a
  # force-pushed tag is a known supply-chain attack path (tj-actions/changed-files, 2025).
  docker-build-scan:
    name: docker-build-scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, console]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build spine-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          tags: spine-${{ matrix.image }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=spine-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=spine-${{ matrix.image }}
          build-args: |
            SPINE_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
      - name: Image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: spine-${{ matrix.image }}:ci
          format: cyclonedx
          output: spine-${{ matrix.image }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: spine-${{ matrix.image }}-sbom.cdx.json
          path: spine-${{ matrix.image }}.cdx.json
      - name: Trivy vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: spine-${{ matrix.image }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # The first step already installed Trivy and downloaded its DB.
          skip-setup-trivy: true
