# Semantic versioning + CHANGELOG from Conventional Commits (ADR-0025).
# release-please opens/updates a "release PR" on main; merging it tags vX.Y.Z and
# publishes a GitHub Release. When a release is created, the images are built, pushed to
# GHCR, signed keylessly with Sigstore cosign and given SLSA build provenance (ADR-0099).
#
# Nothing here runs before the owner merges to main and merges a release PR.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: publish (${{ matrix.image }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, console]
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing (Sigstore) and provenance (OIDC identity of this workflow)
      attestations: write # store the build provenance attestation
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/spine-${{ matrix.image }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push spine-${{ matrix.image }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            SPINE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
      - name: SLSA build provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image by digest (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
