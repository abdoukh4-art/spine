# Semantic versioning + CHANGELOG from Conventional Commits (ADR-0025).
# release-please opens/updates a "release PR" on main; merging it tags vX.Y.Z and
# publishes a GitHub Release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
