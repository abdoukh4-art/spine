# Locations shared by the HTTP (8080) and TLS (8443) servers. ADR-0082.
#
# nginx gotcha: `add_header` is inherited from the enclosing level ONLY if the current
# level has no add_header of its own. Every location below therefore includes the header
# snippet it needs explicitly, instead of relying on server-level headers.

# Concurrent connections per client IP (slowloris-style exhaustion): `limit_conn` is set at
# http level in 10-spine-http.conf.template so the number is configurable (ADR-0093).

# --- API --------------------------------------------------------------------------------------
# Password login: per-IP rate limit on top of the API's own lockout (ADR-0016).
location = /api/v1/auth/login {
    limit_req zone=spine_login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}

# Sensor webhooks (HMAC-signed): burst-tolerant per-IP rate limit.
location /api/v1/ingest/webhooks/ {
    limit_req zone=spine_webhooks burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}

# Bulk import accepts up to 10 MiB (api-contract.md); everything else keeps the 1 MiB default.
location = /api/v1/ingest/batch {
    client_max_body_size 10m;
    proxy_request_buffering on;    # absorb slow uploads here, not in a Node worker
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 60s;
    include /etc/nginx/snippets/api-headers.conf;
}

location /api/ {
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}

# Probes: proxied so an external monitor sees the API's view; not logged (noise).
location = /healthz {
    access_log off;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}
location = /readyz {
    access_log off;
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}

# Swagger UI (served by the API only when ENABLE_API_DOCS / non-production). It sets its
# own CSP, so it gets the API headers, not the SPA's strict CSP.
location /docs {
    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/api-headers.conf;
}

# --- Console (SPA) --------------------------------------------------------------------------
# Vite emits content-hashed file names under /assets: safe to cache "forever".
location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    include /etc/nginx/snippets/spa-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Never serve dotfiles (.env, .git …) even if one ends up in the web root by mistake.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Client-side routing: unknown paths fall back to index.html, which is never cached so a
# deploy is picked up on the next navigation.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/spa-headers.conf;
    add_header Cache-Control "no-cache" always;
}
