# Security headers for the console (SPA). ADR-0082, docs/security/threat-model.md.
#
# CSP: everything from our own origin only. No inline scripts or styles, no eval, no
# third-party hosts. The API is same-origin (/api via this proxy), so connect-src 'self'.
# frame-ancestors 'none' = clickjacking protection (supersedes X-Frame-Options).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security $spine_hsts always;
