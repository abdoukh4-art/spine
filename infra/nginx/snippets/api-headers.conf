# Response headers added to proxied API responses. The API already sets its own security
# headers (helmet: CSP, X-Content-Type-Options, Referrer-Policy …), so nginx only adds
# what belongs to the edge: HSTS (TLS server only; empty on HTTP so it is not sent) and the
# correlation ID for requests nginx answers itself (429, 502, 504).
add_header Strict-Transport-Security $spine_hsts always;
add_header X-Request-ID $spine_request_id always;
