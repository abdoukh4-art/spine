# Reverse-proxy settings for the Spine API. ADR-0082.
proxy_pass http://spine_api;
proxy_http_version 1.1;
proxy_set_header Connection "";            # enable upstream keep-alive

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# OVERWRITE (not append) X-Forwarded-For: nginx is the trust boundary. With the API's
# TRUST_PROXY=true, Fastify believes this header; appending ($proxy_add_x_forwarded_for)
# would let a client prepend a forged address. $remote_addr is already the real client IP
# after real_ip processing (see SPINE_REAL_IP_FROM).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $spine_request_id;

# Timeouts (connect 5s, send/read 30s) are set once at http{} level in
# 10-spine-http.conf.template so individual locations can override them.
# Retry another upstream only for connection failures; nginx never retries non-idempotent
# requests (POST/PATCH) unless told to, which is what we want.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;

proxy_hide_header X-Powered-By;
# The API echoes X-Request-ID; nginx re-adds the same value on every response (including
# its own 429/502/504), so hide the upstream copy to avoid a duplicated header.
proxy_hide_header X-Request-ID;
