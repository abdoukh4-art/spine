# Main nginx configuration for the console image (ADR-0082). Based on the
# nginx-unprivileged default (non-root: pid and temp files under /tmp), with the default
# access log removed: Spine's JSON access log is defined in conf.d/10-spine-http.conf.
worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    # Each proxied request holds two connections (client + upstream). 1024 ran out in the
    # 400 alerts/s load test and nginx answered 500s itself (ADR-0093).
    worker_connections 4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    include /etc/nginx/conf.d/*.conf;
}
